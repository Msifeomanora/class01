version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies
      - npm install

  pre_build:
    commands:
      - echo Running lint
      - npm run lint || echo "No lint script"

  build:
    commands:
      - echo Building app
      - npm run build || echo "No build script"

  post_build:
    commands:
      - echo Running smoke tests
      - npm test

artifacts:
  files:
    - '**/*'

cache:
  paths:
    - node_modules/**/*